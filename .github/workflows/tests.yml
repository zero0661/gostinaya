name: Tests

on:
  pull_request:
  push:
    branches:
      - feature/article-subscriptions
      - fix/lounge-language-mobile

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
