# Prepared only. Do not enable before cutover approval.
server {
 ssl_protocols TLSv1.2;
 client_max_body_size 100M;
 listen 443 ssl;
 server_name milenin.pro www.milenin.pro;
 ssl_certificate /etc/letsencrypt/live/milenin.pro/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/milenin.pro/privkey.pem;
 location = /health {
 allow 127.0.0.1; deny all;
 proxy_pass http://172.18.0.4:3001;
 }
 location / {
 proxy_set_header Host milenin.pro;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-For $remote_addr;
 proxy_set_header X-Forwarded-Proto https;
 proxy_pass http://172.18.0.3:2368;
 }
 location /gostinaya {
 proxy_set_header Host milenin.pro;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-For $remote_addr;
 proxy_set_header X-Forwarded-Proto https;
 proxy_pass http://172.18.0.4:3001;
 }
}
server {
 listen 80;
 server_name milenin.pro www.milenin.pro;
 location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
 location / { return 301 https://milenin.pro$request_uri; }
}
