<style>
.after-login-hero-copy{position:absolute;z-index:3;left:8%;top:25%;width:28%;max-width:390px;color:#fff;font-size:clamp(13px,1.3vw,20px);line-height:1.4;text-shadow:0 1px 5px #000}.after-login-hero-copy p{margin:0 0 .65em;color:#fff!important;font-size:inherit;line-height:inherit}.after-login-hero-copy::before{content:">_";display:block;margin-bottom:.5em;font-family:monospace}@media(max-width:600px){.after-login-hero-copy{left:5%;top:12%;width:45%;font-size:12px;background:rgba(0,0,0,.65);padding:12px;border-radius:8px}}

<script>
(function(){function addCopy(){var picture=document.querySelector(".m-hero__picture");if(!picture||document.getElementById("after-login-hero-copy"))return;var copy=document.createElement("div");copy.id="after-login-hero-copy";copy.className="after-login-hero-copy";var texts=["We grew up without the internet and witnessed the birth of the digital age.","Now we’re trying to understand where it leads us next."];texts.forEach(function(text){var p=document.createElement("p");p.textContent=text;copy.appendChild(p)});picture.appendChild(copy)}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",addCopy);else addCopy()})();
