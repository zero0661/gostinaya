<script>
(function(){if(!/^\/en(?:\/|-|$)/.test(location.pathname))return;function localize(){var labels={"Главное меню":"Main navigation","Открыть меню":"Open menu","Закрыть меню":"Close menu","Открыть подменю":"Open submenu","Открыть поиск":"Open search","Закрыть поиск":"Close search","Переключить тёмный режим":"Toggle dark mode"};document.querySelectorAll("[aria-label]").forEach(function(el){var text=el.getAttribute("aria-label");if(labels[text])el.setAttribute("aria-label",labels[text])});document.querySelectorAll("label.sr-only").forEach(function(el){var text=el.textContent.trim();if(labels[text])el.textContent=labels[text]});document.querySelectorAll("a[href]").forEach(function(el){var url;try{url=new URL(el.getAttribute("href"),location.href)}catch(e){return}if(url.origin===location.origin&&/^\/gostinaya\/?$/.test(url.pathname)&&url.searchParams.get("lang")!=="en"){url.searchParams.set("lang","en");el.setAttribute("href",url.pathname+url.search)}});document.querySelectorAll(".en-submenu-content .m-recent-article__date").forEach(function(el){var text=el.textContent.trim();var m=text.match(/^(\d+)\s+(день|дня|дней|час|часа|часов|минуту|минуты|минут|месяц|месяца|месяцев|год|года|лет)\s+назад$/);if(m){var n=Number(m[1]);var unit=/^д/.test(m[2])?"day":/^час/.test(m[2])?"hour":/^мин/.test(m[2])?"minute":/^мес/.test(m[2])?"month":"year";el.textContent=n+" "+unit+(n===1?"":"s")+" ago"}else if(text==="вчера")el.textContent="Yesterday"})}function start(){localize();new MutationObserver(localize).observe(document.body,{childList:true,subtree:true,characterData:true})}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",start);else start()})();
</script>
