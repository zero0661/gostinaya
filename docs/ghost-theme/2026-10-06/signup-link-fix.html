<script>
(function(){function wireSignup(){var form=document.querySelector("form.after-login-subscribe");if(!form)return;form.id="after-login-signup";document.querySelectorAll("a[href]").forEach(function(link){var url;try{url=new URL(link.getAttribute("href"),location.href)}catch(e){return}if(url.origin!==location.origin||!/^\/newsletter\/?$/.test(url.pathname))return;link.href="#after-login-signup";link.removeAttribute("data-portal");link.addEventListener("click",function(event){event.preventDefault();event.stopImmediatePropagation();form.scrollIntoView({behavior:"smooth",block:"center"});var input=form.querySelector("input[type=email]");if(input)input.focus({preventScroll:true})},true)})}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",wireSignup);else wireSignup()})();
</script>
